<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="150" viewBox="0 0 1000 150"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset=".55" stop-color="#1a1447"/><stop offset="1" stop-color="#0a2a4d"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#7dd3fc" stop-opacity=".45"/></linearGradient>
<linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<linearGradient id="btn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="py" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3776ab"/><stop offset="1" stop-color="#ffd43b"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
</defs><style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;text-rendering:geometricPrecision}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-25px)}}
@keyframes tag{0%{opacity:0}4%{opacity:1}22%{opacity:1}26%{opacity:0}100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.95}}
.f1{animation:float 6s ease-in-out infinite}
.f2{animation:float 7s ease-in-out infinite -2s}
.f3{animation:float 8s ease-in-out infinite -4s}
.d1{animation:drift 14s ease-in-out infinite}
.d2{animation:drift 18s ease-in-out infinite reverse}
.t{opacity:0;animation:tag 12s infinite}
.p{animation:pulse 3s ease-in-out infinite}
</style><clipPath id="clip"><rect width="1000" height="150" rx="26"/></clipPath><g clip-path="url(#clip)"><rect width="1000" height="150" fill="url(#bg)"/><circle class="d1" cx="120" cy="37" r="82" fill="#3b82f6" opacity=".5" filter="url(#blur)"/><circle class="d2" cx="600" cy="135" r="90" fill="#a855f7" opacity=".45" filter="url(#blur)"/><circle class="d1" cx="920" cy="22" r="67" fill="#ec4899" opacity=".3" filter="url(#blur)"/></g><rect x="24" y="24" width="220" height="102" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5" filter="url(#shadow)"/><rect x="24" y="24" width="220" height="102" rx="20" fill="url(#sheen)"/><path d="M44 25.5 H224" stroke="#fff" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round"/><text x="134" y="78" font-size="40" font-weight="800" fill="url(#title)" text-anchor="middle">92%</text><text x="134" y="101" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Prediction accuracy</text><text x="134" y="117" font-size="11" fill="#94a3b8" text-anchor="middle">Medical XAI</text><rect x="262" y="24" width="220" height="102" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5" filter="url(#shadow)"/><rect x="262" y="24" width="220" height="102" rx="20" fill="url(#sheen)"/><path d="M282 25.5 H462" stroke="#fff" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round"/><text x="372" y="78" font-size="40" font-weight="800" fill="url(#title)" text-anchor="middle">435K+</text><text x="372" y="101" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Records analysed</text><text x="372" y="117" font-size="11" fill="#94a3b8" text-anchor="middle">CPCB air quality</text><rect x="500" y="24" width="220" height="102" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5" filter="url(#shadow)"/><rect x="500" y="24" width="220" height="102" rx="20" fill="url(#sheen)"/><path d="M520 25.5 H700" stroke="#fff" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round"/><text x="610" y="78" font-size="40" font-weight="800" fill="url(#title)" text-anchor="middle">18%</text><text x="610" y="101" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Forecast error cut</text><text x="610" y="117" font-size="11" fill="#94a3b8" text-anchor="middle">RF + XGBoost</text><rect x="738" y="24" width="220" height="102" rx="20" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5" filter="url(#shadow)"/><rect x="738" y="24" width="220" height="102" rx="20" fill="url(#sheen)"/><path d="M758 25.5 H938" stroke="#fff" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round"/><text x="848" y="78" font-size="40" font-weight="800" fill="url(#title)" text-anchor="middle">35%</text><text x="848" y="101" font-size="14" font-weight="600" fill="#e2e8f0" text-anchor="middle">Faster API response</text><text x="848" y="117" font-size="11" fill="#94a3b8" text-anchor="middle">Optimised inference</text></svg>