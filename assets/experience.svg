<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="382" viewBox="0 0 1000 382"><defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1f"/><stop offset=".55" stop-color="#1a1447"/><stop offset="1" stop-color="#0a2a4d"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16"/><stop offset="1" stop-color="#fff" stop-opacity=".04"/></linearGradient>
<linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".18"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".65"/><stop offset=".5" stop-color="#fff" stop-opacity=".08"/><stop offset="1" stop-color="#7dd3fc" stop-opacity=".45"/></linearGradient>
<linearGradient id="title" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#60a5fa"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/></linearGradient>
<linearGradient id="btn" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient>
<linearGradient id="py" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3776ab"/><stop offset="1" stop-color="#ffd43b"/></linearGradient>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<filter id="shadow" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000" flood-opacity=".5"/></filter>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="6"/></filter>
</defs><style>
text{font-family:'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;text-rendering:geometricPrecision}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-25px)}}
@keyframes tag{0%{opacity:0}4%{opacity:1}22%{opacity:1}26%{opacity:0}100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.95}}
.f1{animation:float 6s ease-in-out infinite}
.f2{animation:float 7s ease-in-out infinite -2s}
.f3{animation:float 8s ease-in-out infinite -4s}
.d1{animation:drift 14s ease-in-out infinite}
.d2{animation:drift 18s ease-in-out infinite reverse}
.t{opacity:0;animation:tag 12s infinite}
.p{animation:pulse 3s ease-in-out infinite}
</style><clipPath id="clip"><rect width="1000" height="382" rx="28"/></clipPath><g clip-path="url(#clip)"><rect width="1000" height="382" fill="url(#bg)"/><circle class="d1" cx="120" cy="95" r="200" fill="#3b82f6" opacity=".5" filter="url(#blur)"/><circle class="d2" cx="600" cy="343" r="220" fill="#a855f7" opacity=".45" filter="url(#blur)"/><circle class="d1" cx="920" cy="57" r="170" fill="#ec4899" opacity=".3" filter="url(#blur)"/></g><rect x="24" y="20" width="952" height="342" rx="28" fill="url(#glass)" stroke="url(#edge)" stroke-width="1.5" filter="url(#shadow)"/><rect x="24" y="20" width="952" height="342" rx="28" fill="url(#sheen)"/><path d="M52 21.5 H948" stroke="#fff" stroke-opacity=".6" stroke-width="1.2" stroke-linecap="round"/><defs><linearGradient id="g10b981" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3bc597"/><stop offset="1" stop-color="#0b815a"/></linearGradient></defs><rect x="56" y="48" width="64" height="64" rx="17.28" fill="url(#g10b981)" stroke="#fff" stroke-opacity=".45"/><rect x="58" y="50" width="60" height="29.44" rx="15.280000000000001" fill="#fff" fill-opacity=".2"/><g transform="translate(68.8 60.8) scale(1.5999999999999999)"><rect x="3" y="7" width="18" height="13" rx="2.5" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 7V5.5A1.5 1.5 0 0 1 10.5 4h3A1.5 1.5 0 0 1 15 5.5V7M3 13h18" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></g><text x="140" y="76" font-size="23" font-weight="800" fill="#fff">AI &amp; Machine Learning Intern</text><text x="140" y="102" font-size="16" fill="#94a3b8">BIGBUCKS Innovation Private Limited</text><g transform="translate(767 52)"><rect x="0.0" y="0" width="172.2" height="27" rx="13.5" fill="#34d399" fill-opacity=".16" stroke="#34d399" stroke-opacity=".7"/><text x="86.1" y="18.1" font-size="13" font-weight="600" fill="#99e9cc" text-anchor="middle">Aug 2025 - Oct 2025</text></g><circle cx="78" cy="143" r="3.5" fill="#34d399"/><text x="96" y="148" font-size="15" fill="#dbe4f0">Performed data preprocessing, feature engineering and exploratory data analysis on <tspan fill="#7dd3fc" font-weight="700">50K+</tspan> business records</text><text x="96" y="170" font-size="15" fill="#dbe4f0">using Python, SQL, Pandas and Scikit-learn, identifying key demand patterns and actionable insights.</text><circle cx="78" cy="201" r="3.5" fill="#34d399"/><text x="96" y="206" font-size="15" fill="#dbe4f0">Enhanced an AI-powered demand forecasting system using <tspan fill="#7dd3fc" font-weight="700">Random Forest</tspan> and <tspan fill="#7dd3fc" font-weight="700">XGBoost</tspan>, reducing forecasting</text><text x="96" y="228" font-size="15" fill="#dbe4f0">error by <tspan fill="#7dd3fc" font-weight="700">18%</tspan> through feature engineering, hyperparameter tuning (GridSearchCV) and cross-validation.</text><circle cx="78" cy="259" r="3.5" fill="#34d399"/><text x="96" y="264" font-size="15" fill="#dbe4f0">Built scalable data preprocessing pipelines that reduced manual processing time and benchmarked <tspan fill="#7dd3fc" font-weight="700">5+</tspan></text><text x="96" y="286" font-size="15" fill="#dbe4f0">machine learning models to identify the best-performing forecasting algorithm.</text><circle cx="78" cy="317" r="3.5" fill="#34d399"/><text x="96" y="322" font-size="15" fill="#dbe4f0">Engineered <tspan fill="#7dd3fc" font-weight="700">FastAPI</tspan> REST APIs for real-time demand prediction, reducing prediction response time by <tspan fill="#7dd3fc" font-weight="700">35%</tspan></text><text x="96" y="344" font-size="15" fill="#dbe4f0">through optimized inference pipelines.</text></svg>